schema: spec-driven

context: |
  Prefer changes that a reviewer can understand independently.

  During exploration and planning, assess whether the requested
  scope is likely to produce a large or difficult-to-review change.
  Flag multiple independent outcomes, new infrastructure, background
  processing, data migrations, and cross-cutting refactors early.

  When scope looks broad, explain why and propose smaller changes
  with clear outcomes and dependencies before detailing the full plan.

rules:
  proposal:
    - Include a brief review-scope assessment covering affected areas, new dependencies, uncertainty, and whether splitting is recommended.
  design:
    - Reassess review scope as implementation complexity becomes clearer.
  tasks:
    - Identify independently reviewable delivery slices and their dependencies.