services:
  floci:
    image: floci/floci:2.3.0-compat
    ports:
      - "127.0.0.1:4566:4566"
    env_file:
      - .env
    environment:
      # Added for orbstack
      FLOCI_RUN_AS_ROOT: true
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - floci-data:/app/data
      - ./infra/floci/init:/etc/floci/init/start.d:ro
      # Added for orbstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          aws s3api head-bucket --bucket "$${S3_BUCKET_NAME:?Set S3_BUCKET_NAME in .env}" >/dev/null 2>&1
          && aws sqs get-queue-url --queue-name "$${SQS_QUEUE_NAME:?Set SQS_QUEUE_NAME in .env}" >/dev/null 2>&1
          && aws sqs get-queue-url --queue-name "$${SQS_DLQ_NAME:?Set SQS_DLQ_NAME in .env}" >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doc_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doc_ai_dev}
      POSTGRES_DB: ${POSTGRES_DB:-doc_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  floci-data:
  postgres-data:
