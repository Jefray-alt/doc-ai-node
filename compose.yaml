services:
  floci:
    image: floci/floci:2.3.0-compat
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localhost:4566
    volumes:
      - floci-data:/app/data
      - ./infra/floci/init:/etc/floci/init/start.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - aws --endpoint-url http://localhost:4566 s3api head-bucket --bucket doc-ai-local-pdfs >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  floci-data:
